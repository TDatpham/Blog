<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head th:replace="admin/_fragments :: head(~{::title})">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/semantic-ui@2.4.2/dist/semantic.min.css">
    <link rel="stylesheet" href="../../static/css/me.css">
</head>

<body>
    <!--导航-->
    <nav th:replace="admin/_fragments :: menu(4)" class="ui inverted attached segment m-padded-tb-mini m-shadow-small">
    </nav>

    <!--中间内容-->
    <div class="m-container-small m-padded-tb-big">
        <div class="ui container">
            <div class="ui success message" th:unless="${#strings.isEmpty(message)}">
                <i class="close icon"></i>
                <div class="header">Message: </div>
                <p th:text="${message}">Congratulation, operate successfully!</p>
            </div>
            <table class="ui celled table">
                <thead>
                    <tr>
                        <th></th>
                        <th>Avatar</th>
                        <th>Username</th>
                        <th>Nickname</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Operation</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user,iterStat : ${users}">
                        <td th:text="${iterStat.count}">1</td>
                        <td><img class="ui avatar image" th:src="@{${user.avatar}}"></td>
                        <td th:text="${user.username}">user</td>
                        <td th:text="${user.nickname}">nickname</td>
                        <td th:text="${user.email}">user@example.com</td>
                        <td th:text="${user.role}">USER</td>
                        <td th:text="${user.enabled} ? 'Enabled' : 'Disabled'">Enabled</td>
                        <td>
                            <form th:action="@{/admin/users/{id}/status(id=${user.id})}" method="post"
                                style="display: inline-block;">
                                <input type="hidden" name="enabled" th:value="${!user.enabled}">
                                <button type="submit" class="ui mini basic button"
                                    th:classappend="${user.enabled} ? 'orange' : 'green'"
                                    th:text="${user.enabled} ? 'Disable' : 'Enable'">Enable</button>
                            </form>
                            <a href="#" th:href="@{/admin/users/{id}/delete(id=${user.id})}"
                                onclick="return confirm('Are you sure you want to delete this user?')"
                                class="ui mini red basic button">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <br>
    <br>
    <!--底部footer-->
    <footer th:replace="admin/_fragments :: footer" class="ui inverted vertical segment m-padded-tb-massive">
    </footer>

    <!--/*/<th:block th:replace="admin/_fragments :: script">/*/-->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.2/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/semantic-ui@2.4.2/dist/semantic.min.js"></script>
    <!--/*/</th:block>/*/-->
    <script>
        $('.menu.toggle').click(function () {
            $('.m-item').toggleClass('m-mobile-hide');
        });

        $('.ui.dropdown').dropdown({
            on: 'hover'
        });
        $('.message .close')
            .on('click', function () {
                $(this)
                    .closest('.message')
                    .transition('fade');
            });
    </script>
</body>

</html>
