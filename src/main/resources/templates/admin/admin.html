<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head th:replace="admin/_fragments :: head(~{::title})">
    <meta charset="UTF-8">
    <title>User Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/semantic-ui/2.2.4/semantic.min.css">
    <link rel="stylesheet" href="../../static/css/me.css">
</head>

<body>

    <!--导航-->
    <nav th:replace="admin/_fragments :: menu(4)" class="ui inverted attached segment m-padded-tb-mini m-shadow-small">
        <div class="ui container">
            <div class="ui inverted secondary stackable menu">
                <h2 class="ui teal header item">Management</h2>
                <a href="#" class="item"><i class="mini home icon"></i>Blogs</a>
                <a href="#" class="item"><i class="mini idea icon"></i>Categories</a>
                <a href="#" class="item"><i class="mini tags icon"></i>Tags</a>
                <div class="right menu">
                    <div class="ui dropdown item">
                        <div class="text">
                            <img class="ui avatar image" src="https://unsplash.it/100/100?image=1062">
                            User
                        </div>
                        <i class="dropdown icon"></i>
                        <div class="menu">
                            <a href="#" class="item">Sign Out</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!--中间内容-->
    <div class="m-container-small m-padded-tb-big">
        <div class="ui container">
            <div class="ui secondary segment form">
                <h2>User Management</h2>
            </div>
            <div id="table-container">
                <table class="ui compact teal table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Operation</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}">1</td>
                            <td th:text="${user.username}">username</td>
                            <td th:text="${user.email}">user@email.com</td>
                            <td th:text="${user.role}">USER</td>
                            <td th:text="${user.enabled} ? 'Active' : 'Disabled'">Active</td>
                            <td>
                                <button th:onclick="'toggleStatus(' + ${user.id} + ',' + ${!user.enabled} + ')'"
                                    class="ui mini basic button" th:classappend="${user.enabled} ? 'orange' : 'green'"
                                    th:text="${user.enabled} ? 'Disable' : 'Enable'">Disable</button>
                                <button th:onclick="'deleteUser(' + ${user.id} + ')'"
                                    class="ui mini red basic button">Delete</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <br>
    <br>
    <!--footer-->
    <footer th:replace="admin/_fragments :: footer" class="ui inverted vertical segment m-padded-tb-massive">
    </footer>

    <!--/*/<th:block th:replace="admin/_fragments :: script">/*/-->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.2/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/semantic-ui/2.2.4/semantic.min.js"></script>
    <!--/*/</th:block>/*/-->
    <script>
        $('.menu.toggle').click(function () {
            $('.m-item').toggleClass('m-mobile-hide');
        });

        $('.ui.dropdown').dropdown({
            on: 'hover'
        });

        function toggleStatus(id, enabled) {
            $.ajax({
                url: "/admin/user/" + id + "/status",
                type: "PUT",
                data: { enabled: enabled },
                success: function () {
                    location.reload();
                }
            });
        }

        function deleteUser(id) {
            if (confirm("Are you sure?")) {
                $.ajax({
                    url: "/admin/user/" + id,
                    type: "DELETE",
                    success: function () {
                        location.reload();
                    }
                });
            }
        }
    </script>
</body>

</html>
