<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head th:replace="admin/_fragments :: head(~{::title})">
    <meta charset="UTF-8">
    <title>Change Password</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/semantic-ui@2.4.2/dist/semantic.min.css">
</head>
<body>

<br><br><br>
<div class="m-container-small m-padded-tb-massive" style="max-width: 30em !important;">
    <div class="ur container">
        <div class="ui middle aligned center aligned grid">
            <div class="column">
                <h2 class="ui teal image header">
                    <div class="content">
                        Change Password
                    </div>
                </h2>
                <form class="ui large form" method="post" th:action="@{/admin/change-password}">
                    <div class="ui segment">
                        <div class="field">
                            <div class="ui left icon input">
                                <i class="lock icon"></i>
                                <input type="password" name="currentPassword" placeholder="Current Password">
                            </div>
                        </div>
                        <div class="field">
                            <div class="ui left icon input">
                                <i class="lock icon"></i>
                                <input type="password" name="newPassword" placeholder="New Password">
                            </div>
                        </div>
                        <div class="field">
                            <div class="ui left icon input">
                                <i class="lock icon"></i>
                                <input type="password" name="confirmPassword" placeholder="Confirm New Password">
                            </div>
                        </div>
                        <button class="ui fluid large teal submit button">Change Password</button>
                    </div>

                    <div class="ui error mini message"></div>
                    <div class="ui mini negative message"
                         th:unless="${#strings.isEmpty(message)}"
                         th:text="${message}"></div>

                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.2/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/semantic-ui@2.4.2/dist/semantic.min.js"></script>

<script>
    $('.ui.form').form({
        fields : {
            currentPassword : {
                identifier: 'currentPassword',
                rules: [{
                    type : 'empty',
                    prompt: 'Please enter your current password'
                }]
            },
            newPassword : {
                identifier: 'newPassword',
                rules: [{
                    type : 'empty',
                    prompt: 'Please enter a new password'
                }]
            },
            confirmPassword : {
                identifier: 'confirmPassword',
                rules: [{
                    type : 'match[newPassword]',
                    prompt: 'New password and confirm password must match'
                }]
            }
        }
    });
</script>

</body>
</html>
