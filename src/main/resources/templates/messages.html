<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head th:replace="_fragments :: head(~{::title})">
    <meta charset="UTF-8">
    <title>Messages</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/semantic-ui@2.4.2/dist/semantic.min.css">
    <link rel="stylesheet" href="../static/css/me.css">
</head>

<body>
    <nav th:replace="_fragments :: menu(4)" class="ui inverted attached segment m-padded-tb-mini m-shadow-small">
    </nav>

    <div class="m-container m-padded-tb-big">
        <div class="ui container">
            <div class="ui stackable grid">
                <!-- Sidebar: Recent Conversations -->
                <div class="four wide column">
                    <div class="ui top attached segment">
                        <div class="ui header">Conversations</div>
                    </div>
                    <div class="ui attached segment">
                        <div class="ui middle aligned selection list">
                            <a class="item" th:each="u : ${conversations}" th:href="@{/messages(recipientId=${u.id})}"
                                th:classappend="${recipientId == u.id} ? 'active'">
                                <img class="ui avatar image" th:src="${u.avatar}"
                                    src="https://unsplash.it/100/100?image=1005">
                                <div class="content">
                                    <div class="header" th:text="${u.nickname}">User Name</div>
                                </div>
                            </a>
                            <div class="item" th:if="${#lists.isEmpty(conversations)}">
                                <div class="content">No recent conversations.</div>
                            </div>
                        </div>
                    </div>
                    <div class="ui bottom attached segment">
                        <button class="ui fluid teal button" onclick="$('#newMsgModal').modal('show');">New
                            Message</button>
                    </div>
                </div>

                <!-- Main: Chat Area -->
                <div class="twelve wide column">
                    <div class="ui segment" style="min-height: 500px; display: flex; flex-direction: column;">
                        <div style="flex-grow: 1; overflow-y: auto; padding-bottom: 20px;" id="chat-history">
                            <div th:if="${recipient == null}" class="ui center aligned basic segment"
                                style="margin-top: 100px;">
                                <h2 class="ui icon header">
                                    <i class="comments outline icon"></i>
                                    Select a conversation or start a new one
                                </h2>
                            </div>

                            <div th:if="${recipient != null}">
                                <h3 class="ui dividing header">
                                    Chat with <span th:text="${recipient.nickname}">User</span>
                                </h3>

                                <div class="ui comments" style="max-width: 100%;">
                                    <div class="comment" th:each="msg : ${currentConversation}">
                                        <a class="avatar">
                                            <img th:src="${msg.sender.avatar}"
                                                src="https://unsplash.it/100/100?image=1005">
                                        </a>
                                        <div class="content">
                                            <a class="author"
                                                th:text="${msg.sender.id == session.user.id ? 'You' : msg.sender.nickname}">Sender</a>
                                            <div class="metadata">
                                                <span class="date"
                                                    th:text="${#dates.format(msg.createTime, 'yyyy-MM-dd HH:mm')}">Time</span>
                                            </div>
                                            <div class="text" th:text="${msg.content}">
                                                Content
                                            </div>
                                        </div>
                                    </div>
                                    <div th:if="${#lists.isEmpty(currentConversation)}" class="ui info message">
                                        No messages yet. Say hello!
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Reply Box -->
                        <div th:if="${recipient != null}" class="ui form" style="margin-top: 10px;">
                            <form action="#" th:action="@{/messages}" method="post">
                                <input type="hidden" name="receiverId" th:value="${recipient.id}">
                                <div class="field">
                                    <textarea name="content" rows="3" placeholder="Type your message..."
                                        required></textarea>
                                </div>
                                <button type="submit" class="ui teal labeled icon button">
                                    <i class="paper plane icon"></i> Send
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- New Message Modal -->
    <div class="ui small modal" id="newMsgModal">
        <div class="header">New Message</div>
        <div class="content">
            <form action="#" th:action="@{/messages}" method="post" class="ui form">
                <div class="field">
                    <label>Recipient</label>
                    <select name="receiverId" class="ui search dropdown">
                        <option value="">Select User</option>
                        <option th:each="user : ${users}" th:value="${user.id}" th:text="${user.nickname}">User</option>
                    </select>
                </div>
                <div class="field">
                    <label>Message</label>
                    <textarea name="content" rows="3" required></textarea>
                </div>
                <button type="submit" class="ui teal button">Send</button>
            </form>
        </div>
    </div>

    <footer th:replace="_fragments :: footer" class="ui inverted vertical segment m-padded-tb-massive">
    </footer>

    <th:block th:replace="_fragments :: script">
    </th:block>
    <script th:inline="javascript">
        $('.ui.dropdown').dropdown();

        // Scroll to bottom of chat history
        var chatHistory = document.getElementById("chat-history");
        if (chatHistory) {
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
    </script>
</body>

</html>
