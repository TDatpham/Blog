<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head th:replace="_fragments :: head(~{::title})">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/semantic-ui@2.4.2/dist/semantic.min.css">
    <link rel="stylesheet" href="../static/css/me.css">
</head>
<body>

<!--导航-->
<nav th:replace="_fragments :: menu(2)" class="ui inverted attached segment m-padded-tb-mini m-shadow-small">
</nav>

<!--中间内容-->
<div class="m-container-small m-padded-tb-big">
    <div class="ui container">

        <!-- Header -->
        <div class="ui top attached segment">
            <div class="ui middle aligned two column grid">
                <div class="column">
                    <h3 class="ui teal header">Categories</h3>
                </div>
                <div class="right aligned column">
                    Total <h2 class="ui orange header m-inline-block" th:text="${#arrays.length(types)}">14</h2>
                </div>
            </div>
        </div>

        <!-- Category Buttons -->
        <div class="ui attached segment m-padded-tb-large">
            <div class="ui labeled button m-margin-tb-tiny" th:each="type : ${types}">
                <a th:href="@{/types/{id}(id=${type.id})}"
                   class="ui basic button"
                   th:classappend="${type.id==activeTypeId} ? 'teal'"
                   th:text="${type.name}">Category Name</a>
                <div class="ui basic left pointing label"
                     th:classappend="${type.id==activeTypeId} ? 'teal'"
                     th:text="${#arrays.length(type.blogs)}">0</div>
            </div>
        </div>

        <!-- Blogs List -->
        <div class="ui top attached teal segment">
            <div class="ui padded vertical segment m-padded-tb-large" th:each="blog : ${page.content}">
                <div class="ui middle aligned mobile reversed stackable grid">
                    <div class="eleven wide column">
                        <h3 class="ui header">
                            <a th:href="@{/blog/{id}(id=${blog.id})}" target="_blank" class="m-black"
                               th:text="${blog.title}">Blog Title</a>
                        </h3>
                        <p class="m-text" th:text="|${blog.description}......|">Blog description...</p>
                        <div class="ui grid">
                            <div class="eleven wide column">
                                <div class="ui mini horizontal link list">
                                    <div class="item">
                                        <img th:src="@{${blog.user.avatar}}" alt="" class="ui avatar image">
                                        <div class="content"><a href="#" class="header"
                                                                th:text="${blog.user.nickname}">Author</a></div>
                                    </div>
                                    <div class="item">
                                        <i class="calendar icon"></i>
                                        <span th:text="${#dates.format(blog.updateTime,'yyyy-MM-dd')}">2024-10-01</span>
                                    </div>
                                    <div class="item">
                                        <i class="eye icon"></i> <span th:text="${blog.views}">0</span>
                                    </div>
                                </div>
                            </div>
                            <div class="right aligned five wide column">
                                <a href="#" target="_blank"
                                   class="ui teal basic label m-padded-tiny m-text-thin"
                                   th:text="${blog.type.name}">Category</a>
                            </div>
                        </div>
                    </div>

                    <div class="five wide column">
                        <a th:href="@{/blog/{id}(id=${blog.id})}" target="_blank">
                            <img th:src="@{${blog.firstPicture}}" alt="" class="ui rounded image">
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <div class="ui bottom attached segment" th:if="${page.totalPages} > 1">
            <div class="ui middle aligned two column grid">
                <div class="column">
                    <a th:href="@{/(page=${page.number}-1)}"
                       th:unless="${page.first}"
                       class="ui mini teal basic button">Prev</a>
                </div>
                <div class="right aligned column">
                    <a th:href="@{/(page=${page.number}+1)}"
                       th:unless="${page.last}"
                       class="ui mini teal basic button">Next</a>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Footer -->
<footer th:replace="_fragments :: footer"
        class="ui inverted vertical segment m-padded-tb-massive">
</footer>

</body>
</html>
